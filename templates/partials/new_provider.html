<form class="mt-5 grid gap-4 rounded-xl border border-violet-100 bg-violet-50/50 p-5 shadow-sm" hx-post="/providers" hx-target="#app" hx-select="#app" hx-swap="outerHTML">
  <div><label class="mb-1.5 block text-xs font-semibold text-slate-600" for="provider_type">Provider</label><select class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-brand focus:ring-2 focus:ring-brand/20" id="provider_type" name="provider_type" onchange="document.getElementById('display_name').value = this.options[this.selectedIndex].text"><option value="resend" selected>Resend</option><option value="apify">Apify</option><option value="openai">OpenAI</option><option value="neon">Neon</option><option value="upstash">Upstash</option></select></div>
  <div><label class="mb-1.5 block text-xs font-semibold text-slate-600" for="display_name">Display name <span class="font-normal text-slate-400">(optional to change)</span></label><input class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm outline-none placeholder:text-slate-400 focus:border-brand focus:ring-2 focus:ring-brand/20" id="display_name" name="display_name" required value="Resend"></div>
  <div><label class="mb-1.5 block text-xs font-semibold text-slate-600" for="secret_ref">Secret Manager secret name</label><input class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 font-mono text-xs outline-none placeholder:font-sans placeholder:text-slate-400 focus:border-brand focus:ring-2 focus:ring-brand/20" id="secret_ref" name="secret_ref" required placeholder="RESEND_API_KEY"><small class="mt-1 block text-[11px] text-slate-500">Uses this connection’s Google project. The secret value is never stored.</small></div>
  <button class="rounded-lg bg-brand px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-dark" type="submit">Save provider</button>
</form>
