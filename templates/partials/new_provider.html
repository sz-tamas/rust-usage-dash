<form class="grid gap-4 rounded-xl border border-violet-100 bg-violet-50/50 p-5 shadow-sm lg:grid-cols-4 lg:items-end" hx-post="/providers" hx-target="#provider-list" hx-swap="innerHTML">
  <div><label class="mb-1.5 block text-xs font-semibold text-slate-600" for="provider_type">Provider</label><select class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-brand focus:ring-2 focus:ring-brand/20" id="provider_type" name="provider_type"><option value="apify">Apify</option><option value="openai">OpenAI (coming soon)</option><option value="neon">Neon (coming soon)</option><option value="upstash">Upstash (coming soon)</option><option value="resend">Resend (coming soon)</option></select></div>

</form>
